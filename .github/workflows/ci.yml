name: CI

on:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install contract test dependencies
        working-directory: src/cloud
        run: python -m pip install -e ".[test]"
      - name: Validate Python contract schemas and fixtures
        working-directory: src/cloud
        run: python -m pytest tests/test_contracts.py -q
      - name: Build contract fixture tests
        run: dotnet build src/windows/Reliability.Sensor.Tests/Reliability.Sensor.Tests.csproj -c Release
      - name: Verify cross-language contract fixtures
        run: dotnet test src/windows/Reliability.Sensor.Tests/Reliability.Sensor.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ContractFixtureTests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore Windows tests
        run: dotnet restore src/windows/Reliability.Sensor.Tests/Reliability.Sensor.Tests.csproj
      - name: Build Windows tests
        run: dotnet build src/windows/Reliability.Sensor.Tests/Reliability.Sensor.Tests.csproj -c Release --no-restore
      - name: Test Windows sensor
        run: dotnet test src/windows/Reliability.Sensor.Tests/Reliability.Sensor.Tests.csproj -c Release --no-build

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py
      - name: Install cloud test dependencies
        working-directory: src/cloud
        run: python -m pip install -e ".[test]"
      - name: Lint cloud package
        working-directory: src/cloud
        run: python -m ruff check --select E9,F63,F7,F82 app tests
      - name: Type-check stable cloud boundaries
        working-directory: src/cloud
        run: python -m mypy --ignore-missing-imports --follow-imports=skip app/models.py app/config.py app/contracts.py app/policy.py app/auth.py app/worker.py
      - name: Test cloud package
        working-directory: src/cloud
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cloud image
        run: docker build --file src/cloud/Dockerfile --tag reliability-agent:ci src/cloud
