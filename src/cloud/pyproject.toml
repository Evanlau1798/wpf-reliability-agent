[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpf-reliability-agent"
version = "0.1.0"
description = "Cloud workflow for the WPF Reliability Agent."
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
