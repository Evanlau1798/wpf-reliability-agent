[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpf-reliability-agent"
version = "0.1.0"
description = "Cloud workflow for the WPF Reliability Agent."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.21,<3",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3", "pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
